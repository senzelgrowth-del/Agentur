<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Oswald,sans-serif;color:#fff;overflow:hidden;background:#1a0614}
.ad{position:relative;width:1080px;height:1350px}
.bg{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover;object-position:50% 50%;filter:brightness(1.05) saturate(1.05)}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,4,16,.55) 0%,rgba(20,4,16,0) 26%,rgba(20,4,16,0) 70%,rgba(20,4,16,.6) 100%)}
.t{font-weight:700;text-transform:none;letter-spacing:6px;line-height:1.12;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 3px 10px rgba(0,0,0,.45)}
.top{position:absolute;top:60px;width:100%;text-align:center}
.top .t{font-size:118px}
.bottom{position:absolute;bottom:66px;width:100%;text-align:center}
.bottom .t{font-size:76px;letter-spacing:4px}
.info{margin-top:14px;font-weight:500;font-size:34px;letter-spacing:3px;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.info b{color:#FFD27A;font-weight:700}
</style></head><body><div class="ad">
<img class="bg" src="karl-may-feuerwerk-bg.jpg"><div class="fade"></div>
<div class="top"><div class="t">Karl-May-Spiele</div><div class="t">Bad Segeberg</div></div>
<div class="bottom">
  <div class="t">Großes Finale-Feuerwerk</div>
  <div class="info">18.–20.07.2027 · Busreise ab Erfurt · <b>399 €</b></div>
</div>
</div></body></html>
