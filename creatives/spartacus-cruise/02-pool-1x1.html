<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;font-family:Montserrat,sans-serif;color:#0d1f3c;overflow:hidden;background:#fff}
.photo{position:absolute;left:0;top:0;width:1080px;height:810px;object-fit:cover;object-position:30% 55%}
.rainbow{position:absolute;left:0;top:810px;width:1080px;height:8px;background:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#004dff,#750787)}
.panel{position:absolute;left:0;top:818px;width:1080px;height:262px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.brand{font-weight:800;font-size:68px;line-height:1.05;letter-spacing:-.5px}
.brand span{background:linear-gradient(90deg,#e40303,#ff8c00,#d4b800,#008026,#004dff,#750787);-webkit-background-clip:text;background-clip:text;color:transparent}
.h{font-weight:600;font-size:38px;color:#4a5a75;margin-top:14px}
</style></head><body>
<img class="photo" src="pool.jpg"><div class="rainbow"></div>
<div class="panel">
  <div class="brand">Spartacus Gay Cruise <span>2027</span></div>
  <div class="h">Einfach mal abschalten.</div>
</div>
</body></html>
