<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Montserrat,sans-serif;color:#fff;overflow:hidden;background:#1a1238}
.ad{position:relative;width:1080px;height:1350px}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:42% 50%;filter:saturate(1.1) contrast(1.05)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,18,56,.85) 0%,rgba(26,18,56,.35) 22%,rgba(26,18,56,0) 36%,rgba(26,18,56,0) 66%,rgba(26,18,56,.8) 82%,#1a1238 100%)}
.top{position:absolute;top:80px;width:100%;text-align:center}
.title{display:inline-block;font-family:Pacifico,cursive;font-size:120px;line-height:1.2;padding:0 24px 40px;margin-bottom:-40px;background:linear-gradient(180deg,#FFF6D8 0%,#FFD15C 45%,#E9A93A 70%,#FFE9A8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,209,92,.45)) drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.sub{font-weight:800;font-size:44px;margin-top:4px;text-shadow:0 3px 14px rgba(0,0,0,.7)}
.bottom{position:absolute;bottom:80px;width:100%;text-align:center}
.date{font-weight:700;font-size:32px;letter-spacing:2px;margin-bottom:30px;opacity:.95}
.cta{display:inline-block;background:#FFD15C;color:#1a1238;border-radius:60px;padding:26px 60px;font-weight:900;font-size:40px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
</style></head><body><div class="ad">
<img class="bg" src="danzig-bg.jpg"><div class="shade"></div>
<div class="top">
  <div class="title">Silvester in Danzig</div>
  <div class="sub">mit Heiko &amp; Andy</div>
</div>
<div class="bottom">
  <div class="date">30.12. – 02.01. · ab 789 € p.P.</div>
  <div class="cta">Jetzt entdecken</div>
</div>
</div></body></html>
