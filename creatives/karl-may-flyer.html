<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Oswald,sans-serif;color:#fff;overflow:hidden;background:#0f2238}
.ad{position:relative;width:1080px;height:1350px}
.bg{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover;object-position:50% 0%}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,28,52,.42) 0%,rgba(10,28,52,.12) 24%,rgba(10,28,52,0) 34%)}
.top{position:absolute;top:70px;right:64px;text-align:right;text-shadow:0 2px 14px rgba(10,28,52,.45)}
.kicker{font-weight:500;font-size:28px;letter-spacing:7px;text-transform:uppercase;opacity:.95}
.title{font-weight:700;font-size:96px;line-height:1.05;letter-spacing:3px;margin-top:6px}
.line{width:120px;height:4px;background:#F2C66D;margin:22px 0 20px auto;border-radius:2px}
.info{font-weight:400;font-size:36px;letter-spacing:2px;line-height:1.35}
</style></head><body><div class="ad">
<img class="bg" src="karl-may-flyer-bg.jpg"><div class="fade"></div>
<div class="top">
  <div class="kicker">Busreise ab Erfurt</div>
  <div class="title">Karl-May-Spiele<br>Bad Segeberg</div>
  <div class="line"></div>
  <div class="info">18.–20. Juli 2027</div>
</div>
</div></body></html>
