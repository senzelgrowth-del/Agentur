<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Oswald,sans-serif;color:#fff;overflow:hidden;background:#0f2238}
.ad{position:relative;width:1080px;height:1350px}
.bg{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover;object-position:50% 0%}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,22,42,.78) 0%,rgba(8,22,42,.6) 22%,rgba(8,22,42,.25) 34%,rgba(8,22,42,0) 42%)}
.top{position:absolute;top:60px;right:56px;text-align:right;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.kicker{font-weight:600;font-size:42px;letter-spacing:2px;color:#FFD27A}
.title{font-weight:700;font-size:112px;line-height:1.04;letter-spacing:2px;margin-top:4px}
.line{width:140px;height:5px;background:#FFD27A;margin:20px 0 18px auto;border-radius:3px}
.info{font-weight:600;font-size:56px;letter-spacing:1px;line-height:1.2}
</style></head><body><div class="ad">
<img class="bg" src="karl-may-flyer-bg.jpg"><div class="fade"></div>
<div class="top">
  <div class="kicker">Busreise ab Erfurt</div>
  <div class="title">Karl-May-Spiele<br>Bad Segeberg</div>
  <div class="line"></div>
  <div class="info">18.–20. Juli 2027</div>
</div>
</div></body></html>
