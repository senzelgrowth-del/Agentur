<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Playfair+Display:ital,wght@1,700;1,800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Montserrat,sans-serif;color:#fff;overflow:hidden;background:#1c0a14}
.ad{position:relative;width:1080px;height:1350px}
.bg{position:absolute;left:0;top:250px;width:1080px;height:820px;object-fit:cover;object-position:30% 50%}
.fade{position:absolute;left:0;top:250px;width:1080px;height:820px;background:linear-gradient(180deg,#1c0a14 0%,rgba(28,10,20,0) 22%,rgba(28,10,20,0) 70%,#1c0a14 100%)}
.top{position:absolute;top:70px;width:100%;text-align:center}
.kicker{color:#F2C66D;font-weight:800;font-size:26px;letter-spacing:9px}
.title{font-family:Rye,serif;font-size:96px;color:#FBEBD0;margin-top:10px;text-shadow:0 4px 0 #6b2a12,0 8px 24px rgba(0,0,0,.6)}
.bottom{position:absolute;bottom:80px;width:100%;text-align:center}
.h{font-family:'Playfair Display',serif;font-style:italic;font-weight:800;font-size:76px;line-height:1.05;text-shadow:0 4px 20px rgba(0,0,0,.7)}
.sub{font-weight:700;font-size:32px;margin-top:22px;color:#F2C66D;letter-spacing:1px}
.row{display:flex;justify-content:center;align-items:center;gap:34px;margin-top:40px}
.price{font-weight:900;font-size:64px;color:#F2C66D}
.price small{font-size:26px;font-weight:700;color:#fff;margin-left:6px}
.cta{background:linear-gradient(180deg,#F8D891,#E2AE55);color:#2a0f0a;border-radius:60px;padding:26px 56px;font-weight:900;font-size:38px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
</style></head><body><div class="ad">
<img class="bg" src="karl-may-feuerwerk-bg.jpg"><div class="fade"></div>
<div class="top">
  <div class="kicker">BAD SEGEBERG 2027</div>
  <div class="title">Karl-May-Spiele</div>
</div>
<div class="bottom">
  <div class="h">Mit großem<br>Finale-Feuerwerk</div>
  <div class="sub">18.–20.07.2027 · Bus ab Erfurt · Eintritt inkl.</div>
  <div class="row">
    <div class="price">399 €<small>p.P.</small></div>
    <div class="cta">Jetzt entdecken</div>
  </div>
</div>
</div></body></html>
