<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Montserrat,sans-serif;color:#fff;overflow:hidden;background:#3a0d2e}
.ad{position:relative;width:1080px;height:1350px}
.bg{position:absolute;left:0;top:190px;width:1080px;height:900px;object-fit:cover;object-position:30% 50%;filter:brightness(1.2) saturate(1.08)}
.fade{position:absolute;left:0;top:190px;width:1080px;height:902px;background:linear-gradient(180deg,#3a0d2e 0%,rgba(58,13,46,0) 12%,rgba(58,13,46,0) 66%,rgba(58,13,46,.85) 88%,#3a0d2e 100%)}
.top{position:absolute;top:58px;width:100%;text-align:center}
.kicker{color:#F2C66D;font-weight:800;font-size:25px;letter-spacing:8px}
.title{font-family:Rye,serif;font-size:100px;color:#FBEBD0;margin-top:8px;text-shadow:0 4px 0 #6b2a12,0 10px 28px rgba(0,0,0,.6)}
.sticker{position:absolute;top:250px;right:56px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE7A6,#F2C66D 45%,#D99A3A 100%);color:#3a0d2e;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 0 0 6px rgba(255,255,255,.35)}
.sticker .s1{font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:2px}
.sticker .s2{font-weight:900;font-size:56px;line-height:1}
.sticker .s3{font-weight:700;font-size:22px}
.bottom{position:absolute;bottom:64px;width:100%;text-align:center}
.h{font-weight:900;font-size:80px;line-height:1.05;letter-spacing:-1px;text-shadow:0 4px 22px rgba(0,0,0,.6)}
.h2{font-weight:800;font-size:44px;color:#F2C66D;margin-top:10px;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.incl{display:flex;justify-content:center;gap:28px;margin-top:30px;font-weight:700;font-size:27px}
.incl span::before{content:"✓ ";color:#F2C66D;font-weight:900}
.cta{display:inline-block;margin-top:36px;background:linear-gradient(180deg,#FFE09A,#E9B04E);color:#3a0d2e;border-radius:60px;padding:28px 70px;font-weight:900;font-size:40px;box-shadow:0 10px 30px rgba(233,176,78,.35),0 8px 24px rgba(0,0,0,.4)}
</style></head><body><div class="ad">
<img class="bg" src="karl-may-feuerwerk-bg.jpg"><div class="fade"></div>
<div class="top">
  <div class="kicker">BAD SEGEBERG · 18.–20.07.2027</div>
  <div class="title">Karl-May-Spiele</div>
</div>
<div class="sticker"><div class="s1">nur</div><div class="s2">399 €</div><div class="s3">pro Person</div></div>
<div class="bottom">
  <div class="h">Wilder Westen live!</div>
  <div class="h2">mit großem Finale-Feuerwerk</div>
  <div class="incl"><span>Bus ab Erfurt</span><span>2 Nächte mit HP</span><span>Eintritt inkl.</span></div>
  <div class="cta">Jetzt Plätze sichern →</div>
</div>
</div></body></html>
