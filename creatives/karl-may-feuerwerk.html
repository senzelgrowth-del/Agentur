<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Montserrat,sans-serif;color:#fff;overflow:hidden;background:#3a0d2e}
.ad{position:relative;width:1080px;height:1350px}
.bg{position:absolute;left:0;top:0;width:1080px;height:1350px;object-fit:cover;object-position:50% 45%;filter:brightness(1.05) saturate(1.05)}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(58,13,46,.75) 0%,rgba(58,13,46,0) 20%,rgba(58,13,46,0) 58%,rgba(58,13,46,.55) 76%,rgba(58,13,46,.85) 100%)}
.top{position:absolute;top:58px;width:100%;text-align:center}
.kicker{color:#F2C66D;font-weight:800;font-size:25px;letter-spacing:8px}
.title{font-family:Rye,serif;font-size:100px;color:#FBEBD0;margin-top:8px;text-shadow:0 3px 0 #6b2a12,0 4px 12px rgba(0,0,0,.35)}
.sticker{position:absolute;top:250px;right:56px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE7A6,#F2C66D 45%,#D99A3A 100%);color:#3a0d2e;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);box-shadow:0 4px 12px rgba(0,0,0,.25),inset 0 0 0 6px rgba(255,255,255,.35)}
.sticker .s1{font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:2px}
.sticker .s2{font-weight:900;font-size:56px;line-height:1}
.sticker .s3{font-weight:700;font-size:22px}
.bottom{position:absolute;bottom:56px;width:100%;text-align:center}
.h{font-weight:900;font-size:80px;line-height:1.05;letter-spacing:-1px;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.h2{font-weight:800;font-size:44px;color:#F2C66D;margin-top:10px;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.incl{display:flex;justify-content:center;gap:28px;margin-top:26px;font-weight:700;font-size:27px;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.incl span::before{content:"✓ ";color:#F2C66D;font-weight:900}
.cta{display:inline-flex;align-items:center;gap:12px;margin-top:30px;background:#25D366;color:#fff;border-radius:50px;padding:16px 36px;font-weight:800;font-size:28px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
</style></head><body><div class="ad">
<img class="bg" src="karl-may-feuerwerk-bg.jpg"><div class="fade"></div>
<div class="top">
  <div class="kicker">BAD SEGEBERG · 18.–20.07.2027</div>
  <div class="title">Karl-May-Spiele</div>
</div>
<div class="sticker"><div class="s1">nur</div><div class="s2">399 €</div><div class="s3">pro Person</div></div>
<div class="bottom">
  <div class="h">Wilder Westen live!</div>
  <div class="h2">mit großem Finale-Feuerwerk</div>
  <div class="incl"><span>Bus ab Erfurt</span><span>2 Nächte mit HP</span><span>Eintritt inkl.</span></div>
  <div class="cta"><svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"><path d="M24 5a19 19 0 0 0-16.4 28.6L5 43l9.7-2.5A19 19 0 1 0 24 5z"/><path fill="#fff" stroke="none" d="M17.6 14.6c.5 0 1 0 1.3.8l1.8 4.3c.2.4.1.9-.2 1.3l-1.3 1.6c-.3.3-.3.8 0 1.2 1.6 2.7 3.8 4.6 6.6 5.9.4.2.9.1 1.2-.2l1.6-1.9c.3-.4.8-.5 1.3-.3l4.2 2c.5.2.7.7.6 1.2-.3 2.3-2.3 4-4.6 4-7.4-.5-13.7-6.6-14.3-14 0-2.6 1.6-5.7 3.8-5.9z"/></svg>Jetzt per WhatsApp anfragen</div>
</div>
</div></body></html>
