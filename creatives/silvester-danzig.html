<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Montserrat,sans-serif;color:#fff;overflow:hidden;background:#1a1238}
.ad{position:relative;width:1080px;height:1350px}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:42% 50%;filter:saturate(1.1) contrast(1.05)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,18,56,.92) 0%,rgba(26,18,56,.55) 24%,rgba(26,18,56,0) 40%,rgba(26,18,56,0) 52%,rgba(26,18,56,.75) 68%,rgba(26,18,56,.97) 84%,#1a1238 100%)}
.top{position:absolute;top:70px;width:100%;text-align:center}
.kicker{color:#FFD15C;font-weight:800;font-size:26px;letter-spacing:8px}
.title{display:inline-block;font-family:Pacifico,cursive;font-size:112px;line-height:1.2;margin-top:4px;padding:0 24px 40px;margin-bottom:-40px;background:linear-gradient(180deg,#FFF6D8 0%,#FFD15C 45%,#E9A93A 70%,#FFE9A8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,209,92,.45)) drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.pill{display:inline-flex;align-items:center;gap:18px;margin-top:6px;padding:14px 38px;border-radius:60px;border:2px solid #FFD15C;background:rgba(26,18,56,.72);font-weight:800;font-size:40px;color:#fff;box-shadow:0 0 28px rgba(255,209,92,.35),0 8px 24px rgba(0,0,0,.35)}
.pill i{font-style:normal;color:#FFD15C;font-size:30px}
.bottom{position:absolute;bottom:70px;width:100%;text-align:center}
.h{font-weight:900;font-size:68px;line-height:1.05;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.h span{color:#FFD15C}
.sub{font-weight:700;font-size:31px;margin-top:22px;opacity:.95}
.row{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:40px}
.price{border:3px solid #FFD15C;border-radius:60px;padding:18px 34px;font-weight:700;font-size:30px}
.price b{color:#FFD15C;font-size:40px;font-weight:900}
.cta{background:#FFD15C;color:#1a1238;border-radius:60px;padding:24px 52px;font-weight:900;font-size:38px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
</style></head><body><div class="ad">
<img class="bg" src="danzig-bg.jpg">
<div class="shade"></div>
<div class="top">
  <div class="kicker">SCHLAGERGALA · 30.12.2026 – 02.01.2027</div>
  <div class="title">Silvester in Danzig</div>
  <div class="pill"><i>✦</i>mit Heiko &amp; Andy<i>✦</i></div>
</div>
<div class="bottom">
  <div class="h">Feiern Sie ins<br>neue Jahr an der <span>Ostsee</span></div>
  <div class="sub">3 Nächte im 4★-Hotel · Gala-Dinner &amp; Open Bar</div>
  <div class="row">
    <div class="price">ab <b>789 €</b> p.P.</div>
    <div class="cta">Jetzt entdecken</div>
  </div>
</div>
</div></body></html>
