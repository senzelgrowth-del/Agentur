.l2{font-size:118px;color:#fff}
.l2 span{color:#fff}
.l3{font-size:52px;color:#fff;margin-top:14px;-webkit-text-stroke:10px #1b1240}

<img class="photo" src="sonnendeck.jpg">
<div class="t"><div class="l1">Sonne, Meer</div><div class="l2">&amp; <span>Schlager!</span></div><div class="l3">Schlager-Seereise 2027</div></div>
